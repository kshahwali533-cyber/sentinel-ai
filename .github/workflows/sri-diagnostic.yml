name: Temporary SRI Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/supabase-sri-diagnostic.test.js
