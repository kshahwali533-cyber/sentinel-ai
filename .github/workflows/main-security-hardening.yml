name: Main Security Hardening
on:
  pull_request:
    branches: [main, integration/sentinel-evidence-2026-11]
  push:
    branches: [main, reconcile/main-integration-2026-11-15]
permissions:
  contents: read
concurrency:
  group: sentinel-main-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check API syntax
        run: |
          node --check api/scan.js
          node --check api/assistant.js
          node --check api/report.js
          node --check api/_lib/pinned-lookup.js
          node --check api/_lib/public-ip.js
          node --check api/_lib/read-limited.js
      - name: Run security tests
        run: node --test
      - name: Live scanner smoke test for PR 80 only
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 80
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const target = "https://project-3jyda.vercel.app";
          const response = await fetch(target + "/api/scan", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ url: target })
          });
          const body = await response.text();
          assert.equal(response.ok, true, "Scanner API returned " + response.status + ": " + body.slice(0, 500));
          const result = JSON.parse(body);
          assert.equal(new URL(result.finalUrl).origin, new URL(target).origin);
          assert.equal(result.checks?.length, 20);
          assert.equal(result.summary?.totalChecks, result.checks.length);
          assert.ok(Array.isArray(result.surfaceFindings));
          assert.equal(result.surfaceFindings.filter(item => item.title === "Sensitive Surface").length, 0);
          console.log(JSON.stringify({ finalUrl: result.finalUrl, score: result.score, checks: result.checks.length, surfaceFindings: result.surfaceFindings.length }, null, 2));
          NODE
