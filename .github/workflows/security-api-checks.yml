name: Sentinel AI security API checks

on:
  pull_request:
    branches:
      - main
      - security/pin-validated-dns-connection
  push:
    branches:
      - security/pin-validated-dns-connection

jobs:
  syntax-and-ssrf-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate API JavaScript syntax and tests
        run: |
          node --check api/scan.js
          node --check api/assistant.js
          node --check api/report.js
          node --check api/_lib/pinned-lookup.js
          node --check api/_lib/public-ip.js
          node --check api/_lib/security-evidence.js
          node --check test/pinned-lookup.test.js
          node --check test/public-ip.test.js
          node --check test/security-evidence.test.js
          node --test test/pinned-lookup.test.js test/public-ip.test.js test/security-evidence.test.js

      - name: Verify scanner uses pinned DNS connections
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const source = fs.readFileSync("api/scan.js", "utf8");

          if (/\bfetch\s*\(/.test(source)) {
            throw new Error("Unpinned fetch() calls remain in api/scan.js.");
          }

          const helper = fs.readFileSync("api/_lib/pinned-lookup.js", "utf8");

          if (!source.includes("lookup: createPinnedLookup(hostname, pinned)") ||
              !helper.includes("return (lookupHostname, lookupOptions, callback)")) {
            throw new Error("Pinned DNS lookup callback is missing.");
          }

          if (!source.includes("validation.addresses")) {
            throw new Error("Validated DNS addresses are not passed to the request.");
          }

          if (!source.includes("servername: net.isIP(hostname) ? undefined : hostname")) {
            throw new Error("HTTPS hostname verification/SNI configuration is missing.");
          }

          console.log("Pinned DNS connection guard checks passed.");
          NODE
