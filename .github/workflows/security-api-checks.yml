name: Sentinel AI security API checks

on:
  pull_request:
    branches:
      - main
      - security/pin-validated-dns-connection
      - integration/sentinel-evidence-2026-11
      - fix/professional-report-mobile-blank-2026-11
      - fix/restricted-target-scan-guard-2026-11
      - sentinel/release-candidate-2026-11-14
      - security/response-headers-hardening-2026-11
      - feature/monitoring-foundation-20261114
      - feature/finding-evidence-20261114
      - feature/scan-analytics-20261114
      - feature/research-workspace-20261114
      - feature/vulnerability-intelligence-20261114
      - feature/team-workspaces-20261114
      - db/team-workspace-advisor-hardening-20261114
      - feature/team-asset-sharing-20261114
      - feature/enterprise-policy-controls-20261114
      - feature/usage-metering-20261114
  push:
    branches:
      - main
      - feature/final-release-audit-20261117
      - fix/atomic-scan-allowance-2026-11
      - security/pin-validated-dns-connection
      - integration/sentinel-evidence-2026-11
      - fix/professional-report-mobile-blank-2026-11
      - fix/restricted-target-scan-guard-2026-11
      - sentinel/release-candidate-2026-11-14
      - security/response-headers-hardening-2026-11
      - feature/monitoring-foundation-20261114
      - feature/finding-evidence-20261114
      - feature/scan-analytics-20261114
      - feature/research-workspace-20261114
      - feature/vulnerability-intelligence-20261114
      - feature/team-workspaces-20261114
      - db/team-workspace-advisor-hardening-20261114
      - feature/team-asset-sharing-20261114
      - feature/enterprise-policy-controls-20261114
      - feature/usage-metering-20261114

jobs:
  syntax-and-ssrf-guard:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install locked production dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate JavaScript syntax and run unit tests
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find api test -type f -name '*.js' -print0)
          node --check sentinel-app.js
          node --test test/*.test.js

      - name: Verify concurrent monthly scan allowance at the final quota slot
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c "
            CREATE ROLE anon NOLOGIN;
            CREATE ROLE authenticated NOLOGIN;
            CREATE ROLE service_role NOLOGIN BYPASSRLS;
            CREATE SCHEMA auth;
            CREATE SCHEMA private;
            CREATE TABLE auth.users (id uuid PRIMARY KEY);
            CREATE TABLE public.account_entitlements (
              user_id uuid PRIMARY KEY REFERENCES auth.users(id),
              monthly_scan_limit integer NOT NULL,
              status text NOT NULL
            );
            CREATE TABLE public.usage_events (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              user_id uuid NOT NULL REFERENCES auth.users(id),
              event_type text NOT NULL,
              units smallint NOT NULL DEFAULT 1,
              resource_host text,
              metadata jsonb NOT NULL DEFAULT '{}'::jsonb,
              occurred_at timestamptz NOT NULL DEFAULT now()
            );
          "

          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261114143419_sentinel_atomic_scan_allowance_20261114.sql

          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c "
            INSERT INTO auth.users (id) VALUES ('11111111-1111-4111-8111-111111111111');
            INSERT INTO public.account_entitlements (user_id, monthly_scan_limit, status)
              VALUES ('11111111-1111-4111-8111-111111111111', 2, 'active');
            INSERT INTO public.usage_events (user_id, event_type)
              VALUES ('11111111-1111-4111-8111-111111111111', 'scan.completed');
          "

          docker exec -i "$POSTGRES_CONTAINER" bash -s <<'BASH'
          set -euo pipefail
          user_id="11111111-1111-4111-8111-111111111111"

          # Session A holds the per-user transaction lock before reserving.
          # Session B starts while A holds it and must wait for the final slot.
          (psql -U postgres -X -qAt -v ON_ERROR_STOP=1 -c "
            BEGIN;
            SELECT pg_catalog.pg_advisory_xact_lock(pg_catalog.hashtextextended('$user_id', 0));
            SELECT pg_catalog.pg_sleep(2);
            SELECT COALESCE(public.reserve_scan_allowance('$user_id'::uuid)::text, 'NULL');
            COMMIT;
          " > /tmp/reservation-a.txt) &
          pid_a=$!

          sleep 0.2
          (psql -U postgres -X -qAt -v ON_ERROR_STOP=1 -c "
            SELECT COALESCE(public.reserve_scan_allowance('$user_id'::uuid)::text, 'NULL');
          " > /tmp/reservation-b.txt) &
          pid_b=$!

          wait "$pid_a"
          wait "$pid_b"

          result_a="$(awk 'NF { value = $0 } END { print value }' /tmp/reservation-a.txt)"
          result_b="$(awk 'NF { value = $0 } END { print value }' /tmp/reservation-b.txt)"
          if [[ ! "$result_a" =~ ^[0-9a-f-]{36}$ || "$result_b" != "NULL" ]]; then
            echo "Expected session A to reserve the final slot and session B to be rejected."
            echo "Session A: $result_a"
            echo "Session B: $result_b"
            exit 1
          fi

          cancel_result="$(psql -U postgres -X -qAt -v ON_ERROR_STOP=1 -c "SELECT public.cancel_scan_allowance('$result_a'::uuid);")"
          remaining="$(psql -U postgres -X -qAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM private.scan_usage_reservations;")"
          if [[ "$cancel_result" != "t" || "$remaining" != "0" ]]; then
            echo "Reservation cleanup failed: cancel=$cancel_result remaining=$remaining"
            exit 1
          fi

          echo "Concurrent final-slot test passed: one reservation granted, one rejected, cleanup complete."
          BASH
      - name: Verify two-user Research Lab database isolation
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261120115348_sentinel_research_authorization_foundation.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261120115401_sentinel_research_case_deny_client_policies.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261121002602_sentinel_research_fk_indexes.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 < tests/research-case-rls-two-user.sql

      - name: Verify scanner uses pinned DNS connections
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const source = fs.readFileSync("api/scan.js", "utf8");

          if (/\bfetch\s*\(/.test(source)) {
            throw new Error("Unpinned fetch() calls remain in api/scan.js.");
          }

          const lookupHelper = fs.readFileSync("api/_lib/pinned-lookup.js", "utf8");
          const transport = fs.readFileSync("api/_lib/pinned-request.js", "utf8");

          if (!transport.includes("lookup: createPinnedLookup(hostname, pinned)") ||
              !lookupHelper.includes("return (lookupHostname, lookupOptions, callback)")) {
            throw new Error("Pinned DNS lookup callback is missing.");
          }

          const redirectHelper = fs.readFileSync("api/_lib/safe-fetch.js", "utf8");

          if (!redirectHelper.includes("validation.addresses")) {
            throw new Error("Validated DNS addresses are not passed to the request.");
          }

          if (!transport.includes("servername: net.isIP(hostname) ? undefined : hostname") ||
              !transport.includes("isPublicIPAddress = isPublicIP")) {
            throw new Error("HTTPS hostname verification or production public-IP policy is missing.");
          }

          console.log("Pinned DNS connection guard checks passed.");
          NODE

      - name: Validate Vercel security response headers
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const config = JSON.parse(fs.readFileSync("vercel.json", "utf8"));
          const route = config.headers?.find((item) => item.source === "/(.*)");
          const headers = new Map((route?.headers || []).map((item) => [item.key.toLowerCase(), item.value]));

          for (const [name, expected] of [
            ["x-content-type-options", "nosniff"],
            ["x-frame-options", "DENY"],
            ["referrer-policy", "strict-origin-when-cross-origin"]
          ]) {
            if (headers.get(name) !== expected) {
              throw new Error(`Missing or incorrect ${name} response header.`);
            }
          }

          if (!headers.has("content-security-policy")) {
            throw new Error("An enforced Content-Security-Policy response header is required.");
          }

          if (headers.has("content-security-policy-report-only")) {
            throw new Error("Remove the report-only header after the enforced policy is enabled.");
          }

          if (headers.get("access-control-allow-origin") !== "https://project-3jyda.vercel.app") {
            throw new Error("Cross-origin reads must be restricted to the production origin; wildcard CORS is not allowed.");
          }

          console.log("Vercel security response header configuration passed.");
          NODE

      - name: Verify manual redirect safety guards
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const source = fs.readFileSync("api/scan.js", "utf8");
          const redirectBlock = fs.readFileSync("api/_lib/safe-fetch.js", "utf8");
          const requestBlock = fs.readFileSync("api/_lib/pinned-request.js", "utf8");

          if (!source.includes("createPinnedRequest()") ||
              !requestBlock.includes("createPinnedRequest") ||
              !redirectBlock.includes("createSafeFetch")) {
            throw new Error("Scanner transport or safe redirect module is missing.");
          }

          for (const [description, condition] of [
            ["scanner must use the pinned native HTTP transport", requestBlock.includes("transport.request(") && source.includes("createPinnedRequest()")],
            ["transport must use only the validated pinned DNS address", requestBlock.includes("lookup: createPinnedLookup(hostname, pinned)")],
            ["each redirect hop must validate its current destination", redirectBlock.includes("validateTargetURL(currentURL)")],
            ["redirect responses must be handled explicitly", redirectBlock.includes("response.status >= 300") && redirectBlock.includes("response.status < 400")],
            ["redirect Location must be resolved relative to the current URL", redirectBlock.includes("new URL(location, currentURL.href)")],
            ["redirect targets must be validated before the next request", redirectBlock.includes("validateTargetURL(nextURL)")],
            ["private/local redirect destinations must be blocked", redirectBlock.includes("SSRF_REDIRECT_BLOCKED")],
            ["redirect loops must be bounded to five hops", redirectBlock.includes("maxRedirects = 5") && redirectBlock.includes("TOO_MANY_REDIRECTS")],
            ["redirect response bodies must be cancelled before continuing", redirectBlock.includes("response.body?.cancel()")]
          ]) {
            if (!condition) throw new Error(`Redirect safety check failed: ${description}`);
            console.log(`PASS: ${description}`);
          }
          NODE
