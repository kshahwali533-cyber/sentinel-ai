name: Sentinel AI security regression tests

on:
  push:
    branches:
      - fix/api-request-size-limits-2026-11-24
  pull_request:
    branches:
      - preview/integration-83-84-85-20261124

permissions:
  contents: read

jobs:
  security-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check security-critical module syntax
        run: |
          node --check api/scan.js
          node --check api/monitoring.js
          node --check api/monitoring-run.js
          node --check api/_lib/public-ip.js
          node --check api/_lib/pinned-request.js
          node --check api/_lib/pinned-lookup.js
          node --check api/_lib/safe-fetch.js
      - name: Run complete automated test suite
        run: node --test test/*.test.js
