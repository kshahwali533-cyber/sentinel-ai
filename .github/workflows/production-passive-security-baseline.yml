name: Production Passive Security Baseline

on:
  push:
    branches: [main]
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: Passive ZAP baseline
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the latest production deployment
        run: sleep 60
      - name: Run passive baseline against production
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "https://project-3jyda.vercel.app"
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-m 2"
