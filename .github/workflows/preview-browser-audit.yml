name: Sentinel AI Preview browser and mobile audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sentinel-preview-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed pull request
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned browser audit dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1 @axe-core/playwright@4.10.2

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check whether the protected Preview is publicly reachable
        id: preview
        env:
          BASE_URL: https://project-3jyda-git-reconcile-release-candid-0c2371-sentinel-ai14.vercel.app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(curl --connect-timeout 5 --max-time 10 --silent --show-error --output /tmp/sentinel-preview.html --write-out '%{http_code}' "$BASE_URL/" || true)"
            if [[ "$status" == "200" ]] && grep -q "Sentinel AI | Cybersecurity Scanner" /tmp/sentinel-preview.html; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$status" == "401" || "$status" == "403" ]]; then
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "Preview is protected by Vercel authentication. Browser tests are skipped rather than exposing a bypass token to a public CI runner." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "Preview branch alias did not become ready."
          exit 1

      - name: Run desktop, tablet, mobile, keyboard, and accessibility checks
        if: steps.preview.outputs.available == 'true'
        env:
          BASE_URL: https://project-3jyda-git-reconcile-release-candid-0c2371-sentinel-ai14.vercel.app
        run: npx playwright test .github/e2e/sentinel-responsive.spec.js --reporter=line

