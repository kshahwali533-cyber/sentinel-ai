name: Sentinel AI Preview browser and mobile audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sentinel-preview-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed pull request
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned browser audit dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1 @axe-core/playwright@4.10.2

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for the current Preview branch alias
        env:
          BASE_URL: https://project-3jyda-git-reconcile-release-candid-0c2371-sentinel-ai14.vercel.app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$BASE_URL/" -o /tmp/sentinel-preview.html; then
              grep -q "Sentinel AI | Cybersecurity Scanner" /tmp/sentinel-preview.html && exit 0
            fi
            sleep 10
          done
          echo "Preview branch alias did not become ready."
          exit 1

      - name: Run desktop, tablet, mobile, keyboard, and accessibility checks
        env:
          BASE_URL: https://project-3jyda-git-reconcile-release-candid-0c2371-sentinel-ai14.vercel.app
        run: npx playwright test test/browser/sentinel-responsive.spec.js --reporter=line

